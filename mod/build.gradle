// Stemkit: grow vanilla huge fungi from a chosen bone-meal RNG state (MC 26.3, Fabric, no Fabric API needed).
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'dev.stemkit'
base { archivesName = 'stemkit' }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version }
	// the editable tree dictionary (trees.json) is baked into the jar
	inputs.file "trees.json"
	from("trees.json") { into "stemkit" }
	inputs.file "glyphs.json"
	from("glyphs.json") { into "stemkit" }
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
